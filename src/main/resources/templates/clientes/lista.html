<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
    <meta charset="UTF-8">
</head>
<body>

<h1>Lista de Clientes</h1>

<!-- Mensajes -->
<div th:if="${mensaje}" style="color: green;">
    <p th:text="${mensaje}"></p>
</div>

<div th:if="${error}" style="color: red;">
    <p th:text="${error}"></p>
</div>

<a th:href="@{/clientes/nuevo}">Nuevo Cliente</a>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>DPI</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Teléfono</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.DPICliente}"></td>
        <td th:text="${cliente.nombre}"></td>
        <td th:text="${cliente.apellido}"></td>
        <td th:text="${cliente.telefono}"></td>
        <td>
            <a th:href="@{/clientes/editar/{dpi}(dpi=${cliente.DPICliente})}">Editar</a>

            <form th:action="@{/clientes/eliminar/{dpi}(dpi=${cliente.DPICliente})}"
                  method="post" style="display:inline;">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
