<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">KinalApp</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ventas}">Ventas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/detalle-ventas}">Detalle Ventas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-people-fill"></i> Clientes</h2>

        <div>
            <a th:href="@{/}" class="btn btn-secondary me-2">
                <i class="bi bi-house-door-fill"></i> Inicio
            </a>

            <a th:href="@{/clientes/nuevo}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nuevo Cliente
            </a>
        </div>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de clientes -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>DPI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.DPICliente}"></td>
                    <td th:text="${cliente.nombreCliente}"></td>
                    <td th:text="${cliente.apellidoCliente}"></td>
                    <td th:text="${cliente.direccion}"></td>
                    <td>
                        <span th:if="${cliente.estado == 1}" class="badge bg-success">Activo</span>
                        <span th:if="${cliente.estado == 0}" class="badge bg-danger">Inactivo</span>
                    </td>
                    <td class="text-center">
                        <!-- Botón Editar -->
                        <a th:href="@{/clientes/editar/{dpi}(dpi=${cliente.DPICliente})}"
                           class="btn btn-warning btn-sm me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                        <!-- Botón Eliminar -->
                        <form th:action="@{/clientes/eliminar/{dpi}(dpi=${cliente.DPICliente})}"
                              method="post" style="display:inline"
                              onsubmit="return confirm('¿Estás seguro de eliminar este cliente?')">
                            <input type="hidden" name="_method" value="delete">
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="bi bi-trash-fill"></i> Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                <!-- Si no hay clientes -->
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="6" class="text-center text-muted">No hay clientes registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
