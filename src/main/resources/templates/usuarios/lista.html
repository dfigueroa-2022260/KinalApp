<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuarios</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Lista de Usuarios</h2>

<!-- Mensajes -->
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<a th:href="@{/usuarios/nuevo}" class="btn btn-primary mb-3">Nuevo Usuario</a>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>Código</th>
        <th>Username</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.codigoUsuario}"></td>
        <td th:text="${usuario.username}"></td>
        <td th:text="${usuario.email}"></td>
        <td th:text="${usuario.rol}"></td>
        <td th:text="${usuario.estado}"></td>
        <td>
            <a th:href="@{/usuarios/editar/{codigo}(codigo=${usuario.codigoUsuario})}"
               class="btn btn-warning btn-sm">Editar</a>

            <form th:action="@{/usuarios/eliminar/{codigo}(codigo=${usuario.codigoUsuario})}"
                  method="post" style="display:inline;">
                <button class="btn btn-danger btn-sm">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</body>
</html>
