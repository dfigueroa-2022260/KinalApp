<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Usuario</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${usuario.codigoUsuario} != 0 ? 'Editar Usuario' : 'Nuevo Usuario'}"></h2>

<form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">

    <div class="mb-3">
        <label>Código</label>
        <input type="number" th:field="*{codigoUsuario}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Username</label>
        <input type="text" th:field="*{username}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" th:field="*{email}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" th:field="*{password}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Rol</label>
        <input type="text" th:field="*{rol}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Estado</label>
        <input type="number" th:field="*{estado}" class="form-control"/>
    </div>

    <button class="btn btn-success">Guardar</button>
</form>

<br>
<a th:href="@{/usuarios}" class="btn btn-secondary">Volver</a>

</body>
</html>
