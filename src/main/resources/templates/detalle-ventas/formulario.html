<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Detalle Venta - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">KinalApp</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ventas}">Ventas</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/detalle-ventas}">Detalle Ventas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 th:if="${detalle.codigoDetalleVenta == 0}">
                        <i class="bi bi-plus-circle"></i> Nuevo Detalle
                    </h5>
                    <h5 th:if="${detalle.codigoDetalleVenta != 0}">
                        <i class="bi bi-pencil-fill"></i> Editar Detalle
                    </h5>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/detalle-ventas/guardar}" th:object="${detalle}" method="post">

                        <input type="hidden" th:field="*{codigoDetalleVenta}">

                        <!-- Venta -->
                        <div class="mb-3">
                            <label class="form-label">Venta</label>
                            <select class="form-select" name="venta.codigoVenta" required>
                                <option value="">-- Seleccione una venta --</option>
                                <option th:each="venta : ${ventas}"
                                        th:value="${venta.codigoVenta}"
                                        th:text="'Venta #' + ${venta.codigoVenta} + ' - ' + ${venta.cliente.nombreCliente}"
                                        th:selected="${detalle.venta != null && detalle.venta.codigoVenta == venta.codigoVenta}">
                                </option>
                            </select>
                        </div>

                        <!-- Producto -->
                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <select class="form-select" name="producto.codigoProducto" required>
                                <option value="">-- Seleccione un producto --</option>
                                <option th:each="producto : ${productos}"
                                        th:value="${producto.codigoProducto}"
                                        th:text="${producto.nombreProducto} + ' (Stock: ' + ${producto.stock} + ')'"
                                        th:selected="${detalle.producto != null && detalle.producto.codigoProducto == producto.codigoProducto}">
                                </option>
                            </select>
                        </div>

                        <!-- Cantidad -->
                        <div class="mb-3">
                            <label class="form-label">Cantidad</label>
                            <input type="number" min="1" class="form-control"
                                   th:field="*{cantidad}"
                                   placeholder="0"
                                   required>
                        </div>

                        <!-- Precio Unitario -->
                        <div class="mb-3">
                            <label class="form-label">Precio Unitario (Q)</label>
                            <input type="number" step="0.01" min="0" class="form-control"
                                   th:field="*{precioUnitario}"
                                   placeholder="0.00"
                                   required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/detalle-ventas}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save-fill"></i> Guardar
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
