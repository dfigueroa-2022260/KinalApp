<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Detalle</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${detalle.codigoDetalleVenta} != 0 ? 'Editar Detalle' : 'Nuevo Detalle'}"></h2>

<form th:action="@{/detalle-ventas/guardar}" th:object="${detalle}" method="post">

    <div class="mb-3">
        <label>Código</label>
        <input type="number" th:field="*{codigoDetalleVenta}" class="form-control"/>
    </div>

    <!-- Venta -->
    <div class="mb-3">
        <label>Venta</label>
        <select th:field="*{venta}" class="form-control" required>
            <option value="">Seleccione una venta</option>
            <option th:each="v : ${ventas}"
                    th:value="${v}"
                    th:text="'Venta #' + ${v.codigoVenta}">
            </option>
        </select>
    </div>

    <!-- Producto -->
    <div class="mb-3">
        <label>Producto</label>
        <select th:field="*{producto}" class="form-control" required>
            <option value="">Seleccione un producto</option>
            <option th:each="p : ${productos}"
                    th:value="${p}"
                    th:text="${p.nombreProducto}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Cantidad</label>
        <input type="number" th:field="*{cantidad}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Precio Unitario</label>
        <input type="number" step="0.01" th:field="*{precioUnitario}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Subtotal</label>
        <input type="number" step="0.01" th:field="*{subtotal}" class="form-control"/>
    </div>

    <button class="btn btn-success">Guardar</button>
</form>

<br>
<a th:href="@{/detalle-ventas}" class="btn btn-secondary">Volver</a>

</body>
</html>
