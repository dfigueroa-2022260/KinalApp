<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle de Ventas</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Detalle de Ventas</h2>

<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<a th:href="@{/detalle-ventas/nuevo}" class="btn btn-primary mb-3">Nuevo Detalle</a>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>Código</th>
        <th>Venta</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio Unitario</th>
        <th>Subtotal</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${detalles}">
        <td th:text="${d.codigoDetalleVenta}"></td>

        <!-- Ajusta según tus relaciones -->
        <td th:text="${d.venta?.codigoVenta}"></td>
        <td th:text="${d.producto?.nombreProducto}"></td>

        <td th:text="${d.cantidad}"></td>
        <td th:text="${d.precioUnitario}"></td>
        <td th:text="${d.subtotal}"></td>

        <td>
            <a th:href="@{/detalle-ventas/editar/{codigo}(codigo=${d.codigoDetalleVenta})}"
               class="btn btn-warning btn-sm">Editar</a>

            <form th:action="@{/detalle-ventas/eliminar/{codigo}(codigo=${d.codigoDetalleVenta})}"
                  method="post" style="display:inline;">
                <button class="btn btn-danger btn-sm">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</body>
</html>
