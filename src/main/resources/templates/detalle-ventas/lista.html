<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle Ventas - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">KinalApp</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ventas}">Ventas</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/detalle-ventas}">Detalle Ventas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-list-check"></i> Detalle de Ventas</h2>

        <div>
            <!-- Botón Inicio -->
            <a th:href="@{/}" class="btn btn-secondary me-2">
                <i class="bi bi-house-door-fill"></i> Inicio
            </a>

            <!-- Botón Nuevo -->
            <a th:href="@{/detalle-ventas/nuevo}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nuevo Detalle
            </a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Venta</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="detalle : ${detalles}">
                    <td th:text="${detalle.codigoDetalleVenta}"></td>
                    <td th:text="'Venta #' + ${detalle.venta.codigoVenta}"></td>
                    <td th:text="${detalle.producto.nombreProducto}"></td>
                    <td th:text="${detalle.cantidad}"></td>
                    <td th:text="'Q' + ${detalle.precioUnitario}"></td>
                    <td th:text="'Q' + ${detalle.subtotal}"></td>
                    <td class="text-center">
                        <a th:href="@{/detalle-ventas/editar/{codigo}(codigo=${detalle.codigoDetalleVenta})}"
                           class="btn btn-warning btn-sm me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                        <form th:action="@{/detalle-ventas/eliminar/{codigo}(codigo=${detalle.codigoDetalleVenta})}"
                              method="post" style="display:inline"
                              onsubmit="return confirm('¿Estás seguro de eliminar este detalle?')">
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="bi bi-trash-fill"></i> Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(detalles)}">
                    <td colspan="7" class="text-center text-muted">No hay detalles registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
