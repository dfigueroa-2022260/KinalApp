<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Venta - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">KinalApp</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/ventas}">Ventas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/detalle-ventas}">Detalle Ventas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 th:if="${venta.codigoVenta == 0}">
                        <i class="bi bi-cart-plus-fill"></i> Nueva Venta
                    </h5>
                    <h5 th:if="${venta.codigoVenta != 0}">
                        <i class="bi bi-pencil-fill"></i> Editar Venta
                    </h5>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">

                        <input type="hidden" th:field="*{codigoVenta}">

                        <!-- Fecha -->
                        <div class="mb-3">
                            <label class="form-label">Fecha de Venta</label>
                            <input type="date" class="form-control"
                                   th:field="*{fechaVenta}">
                        </div>

                        <!-- Cliente -->
                        <div class="mb-3">
                            <label class="form-label">Cliente</label>
                            <select class="form-select" name="cliente.DPICliente" required>
                                <option value="">-- Seleccione un cliente --</option>
                                <option th:each="cliente : ${clientes}"
                                        th:value="${cliente.DPICliente}"
                                        th:text="${cliente.nombreCliente + ' ' + cliente.apellidoCliente}"
                                        th:selected="${venta.cliente != null && venta.cliente.DPICliente == cliente.DPICliente}">
                                </option>
                            </select>
                        </div>

                        <!-- Usuario -->
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <select class="form-select" name="usuario.codigoUsuario" required>
                                <option value="">-- Seleccione un usuario --</option>
                                <option th:each="usuario : ${usuarios}"
                                        th:value="${usuario.codigoUsuario}"
                                        th:text="${usuario.username}"
                                        th:selected="${venta.usuario != null && venta.usuario.codigoUsuario == usuario.codigoUsuario}">
                                </option>
                            </select>
                        </div>

                        <!-- Total -->
                        <div class="mb-3">
                            <label class="form-label">Total (Q)</label>
                            <input type="number" step="0.01" min="0" class="form-control"
                                   th:field="*{total}"
                                   placeholder="0.00"
                                   required>
                        </div>

                        <!-- Estado -->
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" th:field="*{estado}">
                                <option value="1">Activa</option>
                                <option value="0">Inactiva</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/ventas}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save-fill"></i> Guardar
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
