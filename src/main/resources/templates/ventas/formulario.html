<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Venta</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${venta.codigoVenta} != 0 ? 'Editar Venta' : 'Nueva Venta'}"></h2>

<form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">

    <div class="mb-3">
        <label>Código</label>
        <input type="number" th:field="*{codigoVenta}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Fecha</label>
        <input type="date" th:field="*{fechaVenta}" class="form-control" required/>
    </div>

    <!-- Cliente -->
    <div class="mb-3">
        <label>Cliente</label>
        <select th:field="*{cliente}" class="form-control" required>
            <option value="">Seleccione un cliente</option>
            <option th:each="c : ${clientes}"
                    th:value="${c}"
                    th:text="${c.nombre}">
            </option>
        </select>
    </div>

    <!-- Usuario -->
    <div class="mb-3">
        <label>Usuario</label>
        <select th:field="*{usuario}" class="form-control" required>
            <option value="">Seleccione un usuario</option>
            <option th:each="u : ${usuarios}"
                    th:value="${u}"
                    th:text="${u.username}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Total</label>
        <input type="number" step="0.01" th:field="*{total}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Estado</label>
        <input type="number" th:field="*{estado}" class="form-control"/>
    </div>

    <button class="btn btn-success">Guardar</button>
</form>

<br>
<a th:href="@{/ventas}" class="btn btn-secondary">Volver</a>

</body>
</html>
