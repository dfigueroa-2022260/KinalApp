<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ventas</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Lista de Ventas</h2>

<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<a th:href="@{/ventas/nuevo}" class="btn btn-primary mb-3">Nueva Venta</a>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>Código</th>
        <th>Fecha</th>
        <th>Cliente</th>
        <th>Usuario</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="venta : ${ventas}">
        <td th:text="${venta.codigoVenta}"></td>
        <td th:text="${venta.fechaVenta}"></td>

        <!-- Ajusta según tu relación -->
        <td th:text="${venta.cliente?.nombre}"></td>
        <td th:text="${venta.usuario?.username}"></td>

        <td th:text="${venta.total}"></td>
        <td th:text="${venta.estado}"></td>

        <td>
            <a th:href="@{/ventas/editar/{codigo}(codigo=${venta.codigoVenta})}"
               class="btn btn-warning btn-sm">Editar</a>

            <form th:action="@{/ventas/eliminar/{codigo}(codigo=${venta.codigoVenta})}"
                  method="post" style="display:inline;">
                <button class="btn btn-danger btn-sm">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</body>
</html>
