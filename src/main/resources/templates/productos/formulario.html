<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Producto</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${producto.codigoProducto} != 0 ? 'Editar Producto' : 'Nuevo Producto'"></h2>

<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

    <div class="mb-3">
        <label>Código</label>
        <input type="number" th:field="*{codigoProducto}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" th:field="*{nombreProducto}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Precio</label>
        <input type="number" step="0.01" th:field="*{precio}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Stock</label>
        <input type="number" th:field="*{stock}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Estado</label>
        <input type="number" th:field="*{estado}" class="form-control"/>
    </div>

    <button class="btn btn-success">Guardar</button>
</form>

<br>
<a th:href="@{/productos}" class="btn btn-secondary">Volver</a>

</body>
</html>
